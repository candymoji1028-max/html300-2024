<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="ie=edge">
        <link rel="stylesheet" href="css/style.css">
        <!--<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">-->
        <title>Boba & Moji's Adventure</title>
    </head>
    
        <!-- This web page is inspired by my cartoon animation project, Boba & Moji's Adventure, which I plan to publish on YouTube-->
        <!-- Assignment02 building the layout of the mockup.-->
        <!-- Apply the layout mockup to my webpage-->

    <body>
        <div class="wrapper">
            <div class="page">
                <!--Header-->
                <header class="header">
                <h1 class="header__title">Boba & Moji's Adventure</h1>
                </header>

                <!--Navigation-->
                <nav class="nav">
                    <ul class="nav__list">
                        <li class="nav__item"><a href="#" class="nav__link">Home</a></li>
                        <li class="nav__item"><a href="#" class="nav__link">Meet the Characters</a></li>
                        <li class="nav__item"><a href="#" class="nav__link">Episodes</a></li>
                        <li class="nav__item"><a href="#" class="nav__link">Contact</a></li>
                        <li class="nav__item"><a href="#" class="nav__link">Gallery</a></li>
                    </ul>
                </nav>
                <aside class="sidebar">
                    <h2 class="sidebar__title">Sidebar</h2>
                </aside>
                <main class="hero">
                <!-- Title of cartoon series -->
                <!-- using BEM style naming -->
                    <h2 class="hero__title">Boba & Moji's Adventure</h2>

                <!-- Tagline to introduce the theme -->
                    <p class="hero__subtitle">A girl, a puppy, and endless adventures.</p>
        
                <!-- Animated card -->
                    <div class="hero__card">
                    <!-- Cartoon image -->
                        <img src="images/boba-moji.png" alt="Boba and Moji" class="hero__image">

                    <!-- Button with animation -->
                        <button class="hero__button" onclick="alert('YouTube channel coming soon!')">Watch on Youtube</button>
                    </div>
        
                </main>
                <footer class="footer">
                    <h3 class="footer__title">Footer</h3>
                </footer>
            </div>
        </div>
    </body>
</html>
